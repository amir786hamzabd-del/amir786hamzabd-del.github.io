<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trust Shop BD - Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f3f5f7;
  color:#222;
}

button{
  cursor:pointer;
  border:0;
}

.login-box{
  width:95%;
  max-width:420px;
  margin:80px auto;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.login-box h1{
  text-align:center;
  margin-bottom:10px;
  color:#16a085;
}

.login-box p{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin:7px 0 14px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.btn{
  padding:11px 16px;
  border-radius:8px;
  font-weight:bold;
}

.green{
  background:#16a085;
  color:white;
}

.red{
  background:#e74c3c;
  color:white;
}

.blue{
  background:#2980b9;
  color:white;
}

.gray{
  background:#555;
  color:white;
}

.orange{
  background:#f39c12;
  color:white;
}

header{
  background:#111827;
  color:white;
  padding:15px 20px;
  position:sticky;
  top:0;
  z-index:20;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#2ecc71;
}

.admin-email{
  font-size:13px;
  color:#ccc;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.stat h3{
  color:#777;
  font-size:14px;
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:8px;
  color:#16a085;
}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.tab{
  background:white;
  padding:11px 18px;
  border-radius:8px;
  font-weight:bold;
}

.tab.active{
  background:#16a085;
  color:white;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.card{
  background:white;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.card h2{
  margin-bottom:18px;
}

.product-form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.full{
  grid-column:1/-1;
}

.image-preview{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
}

.image-preview img{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #ddd;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.product{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.product img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.product-info{
  padding:12px;
}

.product-info h3{
  font-size:16px;
  margin-bottom:6px;
}

.price{
  color:#e67e22;
  font-weight:bold;
  margin-bottom:5px;
}

.stock{
  color:#777;
  font-size:13px;
}

.actions{
  display:flex;
  gap:6px;
  margin-top:10px;
}

.actions button{
  flex:1;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,td{
  padding:11px;
  border-bottom:1px solid #eee;
  text-align:left;
  vertical-align:top;
}

th{
  background:#f5f5f5;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  background:#eee;
}

.status.pending{
  background:#fff3cd;
  color:#856404;
}

.status.verified{
  background:#d4edda;
  color:#155724;
}

.status.cancelled{
  background:#f8d7da;
  color:#721c24;
}

.order-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.empty{
  text-align:center;
  padding:40px;
  color:#777;
}

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}

.message{
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  display:none;
}

.success{
  display:block;
  background:#d4edda;
  color:#155724;
}

.error{
  display:block;
  background:#f8d7da;
  color:#721c24;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:white;
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  border-radius:12px;
  padding:22px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:20px;
}

.order-box{
  border:1px solid #ddd;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

.order-box h3{
  margin-bottom:8px;
}

.order-items{
  background:#f8f8f8;
  padding:10px;
  border-radius:8px;
  margin:10px 0;
}

@media(max-width:950px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }

  .dashboard{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){
  .product-form{
    grid-template-columns:1fr;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .product img{
    height:150px;
  }

  .header-inner{
    flex-direction:column;
    align-items:flex-start;
  }

  .container{
    padding:12px;
  }
}

@media(max-width:430px){
  .products{
    grid-template-columns:1fr 1fr;
  }

  .dashboard{
    grid-template-columns:1fr 1fr;
  }

  .stat{
    padding:14px;
  }

  .stat strong{
    font-size:22px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-box">

  <h1>Trust Shop BD</h1>

  <p>Admin Panel Login</p>

  <div id="loginMessage" class="message"></div>

  <input
    type="email"
    id="loginEmail"
    placeholder="Admin Email"
  >

  <input
    type="password"
    id="loginPassword"
    placeholder="Password"
  >

  <button
    class="btn green"
    style="width:100%;"
    onclick="adminLogin()"
  >
    🔐 Login
  </button>

</div>


<!-- ADMIN PANEL -->
<div id="adminPage" style="display:none;">

<header>
  <div class="header-inner">

    <div class="logo">
      🛍️ <span>Trust Shop BD</span> Admin
    </div>

    <div>
      <div class="admin-email" id="adminEmail"></div>
      <button class="btn red" onclick="logout()">
        Logout
      </button>
    </div>

  </div>
</header>


<div class="container">

  <!-- DASHBOARD -->
  <div class="dashboard">

    <div class="stat">
      <h3>Total Products</h3>
      <strong id="totalProducts">0</strong>
    </div>

    <div class="stat">
      <h3>Total Orders</h3>
      <strong id="totalOrders">0</strong>
    </div>

    <div class="stat">
      <h3>Pending Orders</h3>
      <strong id="pendingOrders">0</strong>
    </div>

    <div class="stat">
      <h3>Verified Orders</h3>
      <strong id="verifiedOrders">0</strong>
    </div>

  </div>


  <!-- TABS -->
  <div class="tabs">

    <button
      class="tab active"
      onclick="showTab('productsTab',this)"
    >
      📦 Products
    </button>

    <button
      class="tab"
      onclick="showTab('addTab',this)"
    >
      ➕ Add Product
    </button>

    <button
      class="tab"
      onclick="showTab('ordersTab',this)"
    >
      🛒 Orders
    </button>

  </div>


  <!-- PRODUCTS -->
  <section id="productsTab" class="section active">

    <div class="card">

      <h2>📦 All Products</h2>

      <div id="productsList" class="products">
        <div class="loading">
          Loading products...
        </div>
      </div>

    </div>

  </section>


  <!-- ADD PRODUCT -->
  <section id="addTab" class="section">

    <div class="card">

      <h2 id="formTitle">➕ Add New Product</h2>

      <div id="productMessage" class="message"></div>

      <input type="hidden" id="editId">

      <div class="product-form">

        <div>
          <label>Product Name</label>
          <input
            type="text"
            id="productName"
            placeholder="Example: Premium T-Shirt"
          >
        </div>

        <div>
          <label>Category</label>

          <select id="productCategory">

            <option value="Men">Men</option>
            <option value="Women">Women</option>
            <option value="T-Shirt">T-Shirt</option>
            <option value="Shirt">Shirt</option>
            <option value="Pants">Pants</option>
            <option value="Hoodie">Hoodie</option>
            <option value="Accessories">Accessories</option>

          </select>

        </div>


        <div>
          <label>Price (৳)</label>

          <input
            type="number"
            id="productPrice"
            placeholder="500"
          >

        </div>


        <div>
          <label>Stock</label>

          <input
            type="number"
            id="productStock"
            placeholder="10"
          >

        </div>


        <div class="full">

          <label>Description</label>

          <textarea
            id="productDescription"
            placeholder="Product details..."
          ></textarea>

        </div>


        <div class="full">

          <label>
            Product Images
            <br>
            <small>Maximum 5 images — JPG, PNG, WebP</small>
          </label>

          <input
            type="file"
            id="productImages"
            accept="image/jpeg,image/png,image/webp"
            multiple
          >

          <div
            id="imagePreview"
            class="image-preview"
          ></div>

        </div>


        <div class="full">

          <button
            class="btn green"
            onclick="saveProduct()"
          >
            💾 Save Product
          </button>

          <button
            class="btn gray"
            onclick="clearProductForm()"
          >
            Clear
          </button>

        </div>

      </div>

    </div>

  </section>


  <!-- ORDERS -->
  <section id="ordersTab" class="section">

    <div class="card">

      <h2>🛒 Customer Orders</h2>

      <div id="ordersList">
        <div class="loading">
          Loading orders...
        </div>
      </div>

    </div>

  </section>

</div>

</div>


<!-- ORDER MODAL -->
<div id="orderModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2>Order Details</h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>

    <div id="orderDetails"></div>

  </div>

</div>


<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"https://tbhhgjliufbyiskqyydr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_l6Xo-rjvgso8bDH6UyGUdA_3FpC7lQd";

const ADMIN_EMAIL =
"amir786hamzabd@gmail.com";


const { createClient } =
supabase;

const db =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   GLOBAL
========================= */

let currentProducts = [];
let currentOrders = [];
let selectedFiles = [];

let editingExistingImages = [];


/* =========================
   PAGE START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    const {
      data:{
        session
      }
    } = await db.auth.getSession();

    if(session){

      if(
        session.user.email.toLowerCase()
        === ADMIN_EMAIL.toLowerCase()
      ){

        showAdmin(session.user);

      }else{

        await db.auth.signOut();

      }

    }

  }
);


/* =========================
   LOGIN
========================= */

async function adminLogin(){

  const email =
    document.getElementById("loginEmail")
    .value.trim();

  const password =
    document.getElementById("loginPassword")
    .value;

  const msg =
    document.getElementById("loginMessage");


  if(!email || !password){

    showMessage(
      msg,
      "Email এবং Password দিন।",
      false
    );

    return;
  }


  if(
    email.toLowerCase()
    !== ADMIN_EMAIL.toLowerCase()
  ){

    showMessage(
      msg,
      "এই email Admin email নয়।",
      false
    );

    return;
  }


  const {
    data,
    error
  } =
  await db.auth.signInWithPassword({
    email,
    password
  });


  if(error){

    showMessage(
      msg,
      "Login failed: " + error.message,
      false
    );

    return;
  }


  if(
    data.user.email.toLowerCase()
    !== ADMIN_EMAIL.toLowerCase()
  ){

    await db.auth.signOut();

    showMessage(
      msg,
      "আপনার Admin permission নেই।",
      false
    );

    return;
  }


  showAdmin(data.user);
}


/* =========================
   SHOW ADMIN
========================= */

async function showAdmin(user){

  document.getElementById(
    "loginPage"
  ).style.display="none";


  document.getElementById(
    "adminPage"
  ).style.display="block";


  document.getElementById(
    "adminEmail"
  ).textContent =
    user.email;


  await loadProducts();

  await loadOrders();

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await db.auth.signOut();

  location.reload();

}


/* =========================
   TABS
========================= */

function showTab(id,button){

  document
    .querySelectorAll(".section")
    .forEach(
      x => x.classList.remove("active")
    );


  document
    .querySelectorAll(".tab")
    .forEach(
      x => x.classList.remove("active")
    );


  document
    .getElementById(id)
    .classList.add("active");


  button.classList.add("active");


  if(id==="ordersTab"){
    loadOrders();
  }

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  const box =
    document.getElementById("productsList");

  box.innerHTML =
    `<div class="loading">
      Loading products...
    </div>`;


  const {
    data,
    error
  } =
  await db
    .from("products")
    .select("*")
    .order("id",{ascending:false});


  if(error){

    box.innerHTML =
      `<div class="empty">
        ❌ Products load failed<br><br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  currentProducts =
    data || [];


  document.getElementById(
    "totalProducts"
  ).textContent =
    currentProducts.length;


  renderProducts();

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(){

  const box =
    document.getElementById("productsList");


  if(!currentProducts.length){

    box.innerHTML =
      `<div class="empty">
        এখনো কোনো Product নেই।
      </div>`;

    return;
  }


  box.innerHTML =
    currentProducts.map(
      product => {

        const images =
          getProductImages(product);

        const image =
          images[0] ||
          "https://via.placeholder.com/500x400?text=No+Image";


        return `

        <div class="product">

          <img
            src="${escapeAttribute(image)}"
            alt="${escapeAttribute(product.name || "")}"
          >

          <div class="product-info">

            <h3>
              ${escapeHtml(product.name || "")}
            </h3>

            <div class="price">
              ৳${Number(product.price || 0).toLocaleString()}
            </div>

            <div class="stock">
              Category: ${escapeHtml(product.category || "")}
            </div>

            <div class="stock">
              Stock: ${Number(product.stock || 0)}
            </div>

            <div class="stock">
              Images: ${images.length}
            </div>

            <div class="actions">

              <button
                class="btn blue"
                onclick="editProduct(${product.id})"
              >
                Edit
              </button>

              <button
                class="btn red"
                onclick="deleteProduct(${product.id})"
              >
                Delete
              </button>

            </div>

          </div>

        </div>

        `;

      }
    ).join("");

}


/* =========================
   GET PRODUCT IMAGES
========================= */

function getProductImages(product){

  let images = [];


  if(
    Array.isArray(product.image_urls)
  ){

    images =
      product.image_urls.filter(Boolean);

  }


  if(
    !images.length &&
    product.image_url
  ){

    images =
      [product.image_url];

  }


  return images;

}


/* =========================
   IMAGE PREVIEW
========================= */

document
  .getElementById("productImages")
  .addEventListener(
    "change",
    function(){

      selectedFiles =
        Array.from(this.files || []);


      if(selectedFiles.length > 5){

        alert(
          "Maximum 5 images allowed."
        );

        this.value="";
        selectedFiles=[];

        return;
      }


      renderImagePreview();

    }
  );


function renderImagePreview(){

  const box =
    document.getElementById("imagePreview");


  box.innerHTML="";


  editingExistingImages
    .forEach(
      url => {

        const img =
          document.createElement("img");

        img.src=url;

        box.appendChild(img);

      }
    );


  selectedFiles
    .forEach(
      file => {

        const img =
          document.createElement("img");

        img.src =
          URL.createObjectURL(file);

        box.appendChild(img);

      }
    );

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct(){

  const name =
    document.getElementById("productName")
    .value.trim();

  const category =
    document.getElementById("productCategory")
    .value;

  const price =
    Number(
      document.getElementById("productPrice")
      .value
    );

  const stock =
    Number(
      document.getElementById("productStock")
      .value || 0
    );

  const description =
    document.getElementById("productDescription")
    .value.trim();

  const editId =
    document.getElementById("editId")
    .value;


  const msg =
    document.getElementById("productMessage");


  if(!name){

    showMessage(
      msg,
      "Product name দিন।",
      false
    );

    return;
  }


  if(!price || price < 0){

    showMessage(
      msg,
      "সঠিক Price দিন।",
      false
    );

    return;
  }


  if(
    selectedFiles.length +
    editingExistingImages.length
    > 5
  ){

    showMessage(
      msg,
      "একটি Product-এ সর্বোচ্চ ৫টি image রাখা যাবে।",
      false
    );

    return;
  }


  try{

    const imageUrls =
      [...editingExistingImages];


    /* UPLOAD NEW IMAGES */

    for(
      const file of selectedFiles
    ){

      const ext =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const safeName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2) +
        "." +
        ext;


      const filePath =
        "products/" +
        safeName;


      const {
        error:uploadError
      } =
      await db.storage
        .from("product-images")
        .upload(
          filePath,
          file,
          {
            upsert:false,
            contentType:file.type
          }
        );


      if(uploadError){

        throw uploadError;

      }


      const {
        data:publicData
      } =
      db.storage
        .from("product-images")
        .getPublicUrl(
          filePath
        );


      if(
        publicData &&
        publicData.publicUrl
      ){

        imageUrls.push(
          publicData.publicUrl
        );

      }

    }


    const firstImage =
      imageUrls[0] || null;


    const productData = {

      name:name,

      category:category,

      price:price,

      stock:stock,

      description:description,

      image_url:firstImage,

      image_urls:imageUrls

    };


    if(editId){

      const {
        error
      } =
      await db
        .from("products")
        .update(productData)
        .eq("id",editId);


      if(error){

        throw error;

      }


      showMessage(
        msg,
        "✅ Product update হয়েছে।",
        true
      );


    }else{

      const {
        error
      } =
      await db
        .from("products")
        .insert(productData);


      if(error){

        throw error;

      }


      showMessage(
        msg,
        "✅ Product save হয়েছে।",
        true
      );

    }


    clearProductForm();

    await loadProducts();

  }
  catch(error){

    console.error(error);

    showMessage(
      msg,
      "❌ Product save/update হয়নি: " +
      error.message,
      false
    );

  }

}


/* =========================
   EDIT PRODUCT
========================= */

function editProduct(id){

  const product =
    currentProducts.find(
      p => Number(p.id)===Number(id)
    );


  if(!product){
    return;
  }


  document.getElementById(
    "editId"
  ).value =
    product.id;


  document.getElementById(
    "productName"
  ).value =
    product.name || "";


  document.getElementById(
    "productCategory"
  ).value =
    product.category || "Men";


  document.getElementById(
    "productPrice"
  ).value =
    product.price || "";


  document.getElementById(
    "productStock"
  ).value =
    product.stock || 0;


  document.getElementById(
    "productDescription"
  ).value =
    product.description || "";


  editingExistingImages =
    getProductImages(product);


  selectedFiles=[];


  document.getElementById(
    "productImages"
  ).value="";


  document.getElementById(
    "formTitle"
  ).textContent =
    "✏️ Edit Product";


  renderImagePreview();


  const button =
    document.querySelectorAll(".tab")[1];

  showTab(
    "addTab",
    button
  );

}


/* =========================
   CLEAR FORM
========================= */

function clearProductForm(){

  document.getElementById(
    "editId"
  ).value="";


  document.getElementById(
    "productName"
  ).value="";


  document.getElementById(
    "productPrice"
  ).value="";

    "productStock"
  ).value="0";


  document.getElementById(
    "productDescription"
  ).value="";


  document.getElementById(
    "productImages"
  ).value="";

  editingExistingImages=[];

    "imagePreview"

/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

  const product =
    currentProducts.find(
      p => Number(p.id)===Number(id)
    );


  if(!product){
    return;
  }


  const ok =
    confirm(
      "আপনি কি এই Product delete করতে চান?\n\n"
      + product.name
    );


  if(!ok){
    return;
  }


  const {
    error
  } =
  await db
    .from("products")
    .delete()
    .eq("id",id);


  if(error){

    alert(
      "Delete failed: " +
      error.message
    );

    return;
  }


  alert(
    "✅ Product delete হয়েছে।"
  );


  await loadProducts();

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

  const box =
    document.getElementById("ordersList");


  box.innerHTML =
    `<div class="loading">
      Loading orders...
    </div>`;


  const {
    data,
    error
  } =
  await db
    .from("orders")
    .select("*")
    .order(
      "id",
      {ascending:false}
    );


  if(error){

    box.innerHTML =
      `<div class="empty">
        ❌ Orders load failed<br><br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  currentOrders =
    data || [];


  updateOrderStats();


  renderOrders();

}


/* =========================
   ORDER STATS
========================= */

function updateOrderStats(){

  document.getElementById(
    "totalOrders"
  ).textContent =
    currentOrders.length;


  const pending =
    currentOrders.filter(
      o =>
        String(
          o.payment_status || ""
        ).toLowerCase()
        !== "verified"
    );


  const verified =
    currentOrders.filter(
      o =>
        String(
          o.payment_status || ""
        ).toLowerCase()
        === "verified"
    );


  document.getElementById(
    "pendingOrders"
  ).textContent =
    pending.length;


  document.getElementById(
    "verifiedOrders"
  ).textContent =
    verified.length;

}


/* =========================
   RENDER ORDERS
========================= */

function renderOrders(){

  const box =
    document.getElementById("ordersList");


  if(!currentOrders.length){

    box.innerHTML =
      `<div class="empty">
        কোনো Order পাওয়া যায়নি।
      </div>`;

    return;
  }


  box.innerHTML =
    currentOrders.map(
      order => {

        const paymentStatus =
          order.payment_status ||
          "Pending Verification";


        let statusClass =
          "pending";


        if(
          paymentStatus
            .toLowerCase()
            === "verified"
        ){

          statusClass="verified";

        }


        if(
          String(order.status)
            .toLowerCase()
            .includes("cancel")
        ){

          statusClass="cancelled";

        }


        const date =
          order.created_at
            ? new Date(
                order.created_at
              ).toLocaleString()
            : "";


        return `

        <div class="order-box">

          <h3>
            🛒 Order #${order.id}
          </h3>

          <p>
            <b>Customer:</b>
            ${escapeHtml(
              order.customer_name || ""
            )}
          </p>

          <p>
            <b>Phone:</b>
            ${escapeHtml(
              order.phone || ""
            )}
          </p>

          <p>
            <b>Address:</b>
            ${escapeHtml(
              order.address || ""
            )}
          </p>

          <p>
            <b>Delivery Area:</b>
            ${escapeHtml(
              order.delivery_area || ""
            )}
          </p>

          <p>
            <b>Payment:</b>
            ${escapeHtml(
              order.payment_method || ""
            )}
          </p>

          <p>
            <b>Payment Number:</b>
            ${escapeHtml(
              order.payment_number || ""
            )}
          </p>

          <p>
            <b>TRX ID:</b>
            <strong>
              ${escapeHtml(
                order.transaction_id || "Not provided"
              )}
            </strong>
          </p>

          <p>
            <b>Total:</b>
            ৳${Number(
              order.total || 0
            ).toLocaleString()}
          </p>

          <p>
            <b>Delivery Charge:</b>
            ৳${Number(
              order.delivery_charge || 0
            ).toLocaleString()}
          </p>

          <p>
            <b>Payment Status:</b>
            <span class="status ${statusClass}">
              ${escapeHtml(paymentStatus)}
            </span>
          </p>

          <p>
            <b>Order Status:</b>
            ${escapeHtml(
              order.status || "Pending"
            )}
          </p>

          <p>
            <b>Date:</b>
            ${escapeHtml(date)}
          </p>

          <div class="order-actions">

            <button
              class="btn blue"
              onclick="viewOrder(${order.id})"
            >
              👁️ Details
            </button>

            ${
              paymentStatus.toLowerCase()
              !== "verified"
              ?
              `
              <button
                class="btn green"
                onclick="verifyPayment(${order.id})"
              >
                ✅ Verify Payment
              </button>
              `
              :
              ""
            }

            <button
              class="btn orange"
              onclick="updateOrderStatus(${order.id})"
            >
              📦 Status
            </button>

            <button
              class="btn red"
              onclick="cancelOrder(${order.id})"
            >
              ❌ Cancel
            </button>

          </div>

        </div>

        `;

      }
    ).join("");

}


/* =========================
   VIEW ORDER
========================= */

function viewOrder(id){

  const order =
    currentOrders.find(
      o => Number(o.id)===Number(id)
    );


  if(!order){
    return;
  }


  let items = [];


  try{

    items =
      typeof order.items === "string"
      ?
      JSON.parse(order.items)
      :
      (order.items || []);

  }catch(e){

    items=[];

  }


  const itemHtml =
    Array.isArray(items)
    ?
    items.map(
      item => `

        <div style="
          padding:8px;
          border-bottom:1px solid #ddd;
        ">

          <b>
            ${escapeHtml(
              item.name ||
              item.product_name ||
              "Product"
            )}
          </b>

          <br>

          Qty:
          ${Number(
            item.quantity ||
            item.qty ||
            1
          )}

          <br>

          Price:
          ৳${Number(
            item.price || 0
          ).toLocaleString()}

        </div>

      `
    ).join("")
    :
    "";


  document.getElementById(
    "orderDetails"
  ).innerHTML = `

    <p>
      <b>Order ID:</b>
      #${order.id}
    </p>

    <p>
      <b>Customer:</b>
      ${escapeHtml(
        order.customer_name || ""
      )}
    </p>

    <p>
      <b>Phone:</b>
      ${escapeHtml(
        order.phone || ""
      )}
    </p>

    <p>
      <b>Address:</b>
      ${escapeHtml(
        order.address || ""
      )}
    </p>

    <p>
      <b>Payment Method:</b>
      ${escapeHtml(
        order.payment_method || ""
      )}
    </p>

    <p>
      <b>Payment Number:</b>
      ${escapeHtml(
        order.payment_number || ""
      )}
    </p>

    <p>
      <b>TRX ID:</b>
      ${escapeHtml(
        order.transaction_id || "Not provided"
      )}
    </p>

    <p>
      <b>Payment Status:</b>
      ${escapeHtml(
        order.payment_status ||
        "Pending Verification"
      )}
    </p>

    <div class="order-items">

      <b>Products:</b>

      ${itemHtml}

    </div>

    <p>
      <b>Product/Order Total:</b>
      ৳${Number(
        order.total || 0
      ).toLocaleString()}
    </p>

    <p>
      <b>Delivery Charge:</b>
      ৳${Number(
        order.delivery_charge || 0
      ).toLocaleString()}
    </p>

    <p>
      <b>Order Status:</b>
      ${escapeHtml(
        order.status || "Pending"
      )}
    </p>

  `;


  document.getElementById(
    "orderModal"
  ).classList.add("show");

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

  document.getElementById(
    "orderModal"
  ).classList.remove("show");

}


/* =========================
   VERIFY PAYMENT
========================= */

async function verifyPayment(id){

  const order =
    currentOrders.find(
      o => Number(o.id)===Number(id)
    );


  if(!order){
    return;
  }


  const trx =
    order.transaction_id ||
    "";


  if(!trx){

    alert(
      "এই Order-এ TRX ID নেই।"
    );

    return;
  }


  const ok =
    confirm(
      "TRX ID:\n" +
      trx +
      "\n\nPayment verify করবেন?"
    );


  if(!ok){
    return;
  }


  const {
    error
  } =
  await db
    .from("orders")
    .update({
      payment_status:"Verified"
    })
    .eq("id",id);


  if(error){

    alert(
      "Verification failed: " +
      error.message
    );

    return;
  }


  alert(
    "✅ Payment verified হয়েছে।"
  );


  await loadOrders();

}


/* =========================
   UPDATE ORDER STATUS
========================= */

async function updateOrderStatus(id){

  const order =
    currentOrders.find(
      o => Number(o.id)===Number(id)
    );


  if(!order){
    return;
  }


  const status =
    prompt(
      "নতুন Order Status লিখুন:\n\n"
      + "Pending\n"
      + "Confirmed\n"
      + "Processing\n"
      + "Shipped\n"
      + "Delivered\n"
      + "Cancelled",
      order.status || "Pending"
    );


  if(status===null){
    return;
  }


  const newStatus =
    status.trim();


  if(!newStatus){
    return;
  }


  const {
    error
  } =
  await db
    .from("orders")
    .update({
      status:newStatus
    })
    .eq("id",id);


  if(error){

    alert(
      "Status update failed: " +
      error.message
    );

    return;
  }


  await loadOrders();

}


/* =========================
   CANCEL ORDER
========================= */

async function cancelOrder(id){

  const ok =
    confirm(
      "এই Order Cancel করবেন?"
    );


  if(!ok){
    return;
  }


  const {
    error
  } =
  await db
    .from("orders")
    .update({
      status:"Cancelled"
    })
    .eq("id",id);


  if(error){

    alert(
      "Cancel failed: " +
      error.message
    );

    return;
  }


  await loadOrders();

}


/* =========================
   MESSAGE
========================= */

function showMessage(
  element,
  text,
  success
){

  element.textContent=text;

  element.className =
    "message " +
    (success
      ? "success"
      : "error");

}


/* =========================
   SECURITY HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return escapeHtml(value);

}


/* =========================
   AUTH LISTENER
========================= */

db.auth.onAuthStateChange(
  async (event,session)=>{

    if(
      event === "SIGNED_IN" &&
      session
    ){

      if(
        session.user.email.toLowerCase()
        === ADMIN_EMAIL.toLowerCase()
      ){

        showAdmin(
          session.user
        );

      }else{

        await db.auth.signOut();

      }

    }

  }
);


/* =========================
   CLOSE MODAL OUTSIDE
========================= */

document
  .getElementById("orderModal")
  .addEventListener(
    "click",
    function(e){

      if(e.target === this){

        closeModal();

      }

    }
  );

</script>
