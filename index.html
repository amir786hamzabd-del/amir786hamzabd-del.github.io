.modal{

}

.close{
  float:right;

  cursor:pointer;
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:5px;
}

.form-btn{
  width:100%;
  padding:12px;
  background:#111;
  color:white;
  border:none;

  cursor:pointer;
}

.admin-panel{

}

.cart-item{
  border-bottom:1px solid #ddd;
  padding:10px 0;
  display:flex;
  justify-content:space-between;
}

.delete-btn{
  background:red !important;
}

.empty{

}

footer{

}

.whatsapp{

  right:20px;
  bottom:20px;
  background:#25D366;
  color:white;
  padding:15px;
  border-radius:50%;
  font-size:25px;
  text-decoration:none;
}

@media(max-width:600px){
  .logo{
    font-size:18px;
  }

  .hero h1{
    font-size:27px;
  }
}
</style>

</head>

<body>

Trust <span>Shop BD</span>

<div>

onclick="logoutAdmin()"

>

Logout

<div class="admin-panel" id="adminPanel">

<input
id="productName"
placeholder="Product Name"
>

<input
id="productPrice"

>

<option value="Men">Men</option>

<input

<span class="close" onclick="closeCart()">×</span>

<h2>Your Cart</h2>

<br>

<div id="cartItems"></div>

<h3 style="margin-top:20px">

Total: ৳<span id="cartTotal">0</span>

</h3>

class="form-btn"
onclick="showCheckout()"
>

</div>

</div>

<span class="close" onclick="closeCheckout()">×</span>

<h2>Checkout</h2>

<input
id="customerName"

>

id="customerPhone"

<script type="module">

/* =========================
FIREBASE IMPORT
========================= */

import {

initializeApp

} from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged

} from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

getFirestore,
collection,
addDoc,
getDocs,
query,
orderBy,
serverTimestamp

} from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
FIREBASE CONFIG
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyCDCOIYo9wlK1Z-luMbL7Ckny1j10ZbDP8",

authDomain:
"trust-shop-bd-6047c.firebaseapp.com",

projectId:
"trust-shop-bd-6047c",

storageBucket:
"trust-shop-bd-6047c.firebasestorage.app",

messagingSenderId:
"312927877037",

appId:
"1:312927877037:web:2dbb793c9b1828ce29d324",

measurementId:
"G-4YPXE0RM3X"

};


/* =========================
INITIALIZE FIREBASE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
GLOBAL VARIABLES
========================= */

let productsData = [];

let cart = JSON.parse(
localStorage.getItem("trustShopCart")
) || [];


/* =========================
LOAD PRODUCTS
========================= */

async function loadProducts(){

const productsDiv =
document.getElementById("products");

productsDiv.innerHTML =
'<div class="empty">Loading Products...</div>';

try{

const q =
query(
collection(db,"products"),
orderBy("createdAt","desc")
);

const snapshot =
await getDocs(q);

productsData = [];

snapshot.forEach(doc=>{

productsData.push({

id:doc.id,

...doc.data()

});

});

displayProducts(productsData);

}

catch(error){

console.error(error);

productsDiv.innerHTML =

'<div class="empty">No products found yet.</div>';

}

}


/* =========================
DISPLAY PRODUCTS
========================= */

function displayProducts(products){

const productsDiv =
document.getElementById("products");

productsDiv.innerHTML = "";

if(products.length === 0){

productsDiv.innerHTML =

'<div class="empty">No Products Available</div>';

return;

}

products.forEach(product=>{

const image =
product.image ||
"https://via.placeholder.com/400x400?text=No+Image";

productsDiv.innerHTML += `

<div class="product">

<img src="${image}">

<div class="product-info">

<h3>${product.name}</h3>

<p>${product.description || ""}</p>

<div class="price">

৳${product.price}

</div>

<p>

Category: ${product.category}

</p>

<br>

<button
onclick="addToCart(
'${product.id}',
'${product.name.replace(/'/g,"\\'")}',
${product.price}
)"
>

Add to Cart

</button>

</div>

</div>

`;

});

}


/* =========================
FILTER PRODUCTS
========================= */

window.filterProducts = function(category){

if(category === "all"){

displayProducts(productsData);

return;

}

const filtered =
productsData.filter(

product =>
product.category === category

);

displayProducts(filtered);

};


/* =========================
LOGIN MODAL
========================= */

window.openLogin = function(){

document.getElementById(
"loginModal"
).style.display = "block";

};


window.closeLogin = function(){

document.getElementById(
"loginModal"
).style.display = "none";

};


/* =========================
ADMIN LOGIN
========================= */

window.loginAdmin =
async function(){

const email =
document.getElementById(
"loginEmail"
).value.trim();

const password =
document.getElementById(
"loginPassword"
).value;

const message =
document.getElementById(
"loginMessage"
);

message.style.color = "red";

message.innerText = "";

if(!email || !password){

message.innerText =
"Email এবং Password দিন।";

return;

}

try{

await signInWithEmailAndPassword(

auth,
email,
password

);

message.style.color =
"green";

message.innerText =
"Login Successful!";

document.getElementById(
"loginModal"
).style.display =
"none";

document.getElementById(
"adminModal"
).style.display =
"block";

}

catch(error){

console.error(
"LOGIN ERROR:",
error.code,
error.message
);

let errorText =
"Login Failed: " + error.code;

if(
error.code ===
"auth/invalid-credential"
){

errorText =
"Email অথবা Password ভুল। Firebase Authentication → Users থেকে Email check করুন।";

}

if(
error.code ===
"auth/user-not-found"
){

errorText =
"এই Email Firebase Authentication-এ পাওয়া যায়নি।";

}

if(
error.code ===
"auth/invalid-email"
){

errorText =
"Email address সঠিক নয়।";

}

if(
error.code ===
"auth/operation-not-allowed"
){

errorText =
"Firebase Authentication-এ Email/Password Enable করুন।";

}

message.innerText =
errorText;

}

};


/* =========================
AUTH STATE
========================= */

onAuthStateChanged(

auth,

user => {

if(user){

document.getElementById(
"adminPanel"
).style.display =
"block";

}

else{

document.getElementById(
"adminPanel"
).style.display =
"none";

}

}

);


/* =========================
CLOSE ADMIN
========================= */

window.closeAdmin = function(){

document.getElementById(
"adminModal"
).style.display =
"none";

};


/* =========================
LOGOUT
========================= */

window.logoutAdmin =
async function(){

await signOut(auth);

alert("Logged Out");

closeAdmin();

};


/* =========================
ADD PRODUCT
========================= */

window.addProduct =
async function(){

const user =
auth.currentUser;

if(!user){

alert(
"Admin Login Required"
);

return;

}

const name =
document.getElementById(
"productName"
).value.trim();

const price =
Number(
document.getElementById(
"productPrice"
).value
);

const category =
document.getElementById(
"productCategory"
).value;

const stock =
Number(
document.getElementById(
"productStock"
).value
);

const description =
document.getElementById(
"productDescription"
).value.trim();

const imageFile =
document.getElementById(
"productImage"
).files[0];

const message =
document.getElementById(
"adminMessage"
);

if(
!name ||
!price
){

message.style.color = "red";

message.innerText =
"Product Name এবং Price দিন।";

return;

}


/* DIRECT IMAGE LOAD */

let imageUrl = "";

if(imageFile){

imageUrl =
await convertImageToBase64(
imageFile
);

}


try{

await addDoc(

collection(db,"products"),

{

name:name,

price:price,

category:category,

stock:stock,

description:description,

image:imageUrl,

createdAt:
serverTimestamp()

}

);


message.style.color =
"green";

message.innerText =
"Product Successfully Added!";


document.getElementById(
"productName"
).value = "";

document.getElementById(
"productPrice"
).value = "";

document.getElementById(
"productStock"
).value = "";

document.getElementById(
"productDescription"
).value = "";

document.getElementById(
"productImage"
).value = "";


loadProducts();

}

catch(error){

console.error(error);

message.style.color =
"red";

message.innerText =
"Error: " +
error.message;

}

};


/* =========================
IMAGE BASE64
========================= */

function convertImageToBase64(file){

return new Promise(

(resolve,reject)=>{

const reader =
new FileReader();

reader.onload = () => {

resolve(
reader.result
);

};

reader.onerror =
reject;

reader.readAsDataURL(
file
);

}

);

}


/* =========================
CART
========================= */

window.addToCart =
function(id,name,price){

cart.push({

id:id,

name:name,

price:Number(price)

});

saveCart();

alert(
"Product Added to Cart"
);

};


function saveCart(){

localStorage.setItem(

"trustShopCart",

JSON.stringify(cart)

);

updateCartCount();

}


function updateCartCount(){

document.getElementById(
"cartCount"
).innerText =
cart.length;

}


/* =========================
OPEN CART
========================= */

window.openCart =
function(){

document.getElementById(
"cartModal"
).style.display =
"block";

renderCart();

};


window.closeCart =
function(){

document.getElementById(
"cartModal"
).style.display =
"none";

};


function renderCart(){

const cartItems =
document.getElementById(
"cartItems"
);

cartItems.innerHTML = "";

let total = 0;

if(cart.length === 0){

cartItems.innerHTML =
"<p>Your cart is empty.</p>";

}

cart.forEach(

(item,index)=>{

total += item.price;

cartItems.innerHTML += `

<div class="cart-item">

<div>

<b>${item.name}</b>

<br>

৳${item.price}

</div>

<button
class="delete-btn"
onclick="removeCart(${index})"
>

Remove

</button>

</div>

`;

}

);

document.getElementById(
"cartTotal"
).innerText =
total;

}


window.removeCart =
function(index){

cart.splice(index,1);

saveCart();

renderCart();

};


/* =========================
CHECKOUT
========================= */

window.showCheckout =
function(){

if(cart.length === 0){

alert(
"Your Cart is Empty"
);

return;

}

closeCart();

document.getElementById(
"checkoutModal"
).style.display =
"block";

};


window.closeCheckout =
function(){

document.getElementById(
"checkoutModal"
).style.display =
"none";

};


/* =========================
PLACE ORDER
========================= */

window.placeOrder =
async function(){

const name =
document.getElementById(
"customerName"
).value.trim();

const phone =
document.getElementById(
"customerPhone"
).value.trim();

const address =
document.getElementById(
"customerAddress"
).value.trim();

const message =
document.getElementById(
"orderMessage"
);

if(
!name ||
!phone ||
!address
){

message.style.color =
"red";

message.innerText =
"সব তথ্য পূরণ করুন।";

return;

}

let total = 0;

cart.forEach(

item => {

total += item.price;

}

);


try{

await addDoc(

collection(db,"orders"),

{

customerName:name,

phone:phone,

address:address,

products:cart,

total:total,

createdAt:
serverTimestamp(),

status:
"Pending"

}

);


message.style.color =
"green";

message.innerText =
"Order Successfully Placed!";


const whatsappMessage =

"New Order%0A%0A" +

"Customer: " +
encodeURIComponent(name) +

"%0APhone: " +
encodeURIComponent(phone) +

"%0AAddress: " +
encodeURIComponent(address) +

"%0ATotal: ৳" +
total;


cart = [];

saveCart();


setTimeout(

()=>{

window.open(

"https://wa.me/8801580950532?text=" +
whatsappMessage,

"_blank"

);

closeCheckout();

},

1000

);

}

catch(error){

console.error(error);

message.style.color =
"red";

message.innerText =
"Order Error: " +
error.message;

}

};


/* =========================
START
========================= */

loadProducts();

updateCartCount();

</script>

</body>
</html>
