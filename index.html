```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trust Shop BD - Firebase Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      width: 95%;
      max-width: 900px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    input,
    textarea,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    button {
      border: 0;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: .9;
    }

    .logout {
      background: #dc2626;
    }

    .delete {
      background: #dc2626;
      width: auto;
      padding: 8px 14px;
    }

    .product {
      border: 1px solid #eee;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .product img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      margin-bottom: 10px;
    }

    #adminArea {
      display: none;
    }

    #message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      display: none;
      background: #eef2ff;
    }

    .status {
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>Trust Shop BD</h1>
  <p>Firebase Test Version</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div class="card" id="loginArea">

    <h2>Admin Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginBtn">
      Login
    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- ADMIN -->
  <div class="card" id="adminArea">

    <div class="status">
      Logged in as:
      <span id="userEmail"></span>
    </div>

    <button class="logout" id="logoutBtn">
      Logout
    </button>

    <hr>

    <h2>Add Product</h2>

    <input
      type="text"
      id="productName"
      placeholder="Product Name"
    >

    <input
      type="number"
      id="productPrice"
      placeholder="Price"
    >

    <input
      type="number"
      id="productStock"
      placeholder="Stock"
    >

    <input
      type="text"
      id="productImage"
      placeholder="Image URL"
    >

    <textarea
      id="productDescription"
      placeholder="Product Description"
      rows="4"
    ></textarea>

    <button id="saveBtn">
      Save Product
    </button>

    <div id="message"></div>

  </div>


  <!-- PRODUCTS -->
  <div class="card">

    <h2>Products</h2>

    <button id="refreshBtn">
      Refresh Products
    </button>

    <div id="productsList">
      Loading...
    </div>

  </div>

</div>


<script type="module">

  // ============================================
  // FIREBASE IMPORT
  // ============================================

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  // ============================================
  // YOUR FIREBASE CONFIG
  // ============================================

  const firebaseConfig = {

    apiKey:
      "AIzaSyCDCOIYo9wlK1Z-luMb7Ckny1j10ZbDP8",

    authDomain:
      "trust-shop-bd-6047c.firebaseapp.com",

    projectId:
      "trust-shop-bd-6047c",

    storageBucket:
      "trust-shop-bd-6047c.firebasestorage.app",

    messagingSenderId:
      "312927877037",

    appId:
      "1:312927877037:web:2dbb793c9b1828ce29d324",

    measurementId:
      "G-4YPXE0RM3X"
  };


  // ============================================
  // INITIALIZE FIREBASE
  // ============================================

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  // ============================================
  // ELEMENTS
  // ============================================

  const loginArea =
    document.getElementById("loginArea");

  const adminArea =
    document.getElementById("adminArea");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const loginBtn =
    document.getElementById("loginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const userEmail =
    document.getElementById("userEmail");

  const saveBtn =
    document.getElementById("saveBtn");

  const refreshBtn =
    document.getElementById("refreshBtn");

  const productsList =
    document.getElementById("productsList");

  const loginMessage =
    document.getElementById("loginMessage");

  const message =
    document.getElementById("message");


  // ============================================
  // MESSAGE
  // ============================================

  function showLoginMessage(text) {

    loginMessage.style.display = "block";

    loginMessage.textContent = text;

  }


  function showMessage(text) {

    message.style.display = "block";

    message.textContent = text;

  }


  // ============================================
  // LOGIN
  // ============================================

  loginBtn.addEventListener("click", async () => {

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if (!email || !password) {

      showLoginMessage(
        "Email and password দিন।"
      );

      return;
    }

    loginBtn.disabled = true;

    loginBtn.textContent =
      "Logging in...";

    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      showLoginMessage(
        "Login successful."
      );

    } catch (error) {

      console.error(error);

      showLoginMessage(
        "Login failed: " +
        error.code +
        " — " +
        error.message
      );

    }

    loginBtn.disabled = false;

    loginBtn.textContent =
      "Login";

  });


  // ============================================
  // LOGOUT
  // ============================================

  logoutBtn.addEventListener("click", async () => {

    try {

      await signOut(auth);

    } catch (error) {

      console.error(error);

      alert(error.message);

    }

  });


  // ============================================
  // AUTH STATE
  // ============================================

  onAuthStateChanged(auth, async (user) => {

    if (user) {

      console.log(
        "Firebase user:",
        user.email
      );

      loginArea.style.display =
        "none";

      adminArea.style.display =
        "block";

      userEmail.textContent =
        user.email || "";

      await loadProducts();

    } else {

      console.log(
        "No user logged in"
      );

      loginArea.style.display =
        "block";

      adminArea.style.display =
        "none";

      userEmail.textContent =
        "";

      await loadProducts();

    }

  });


  // ============================================
  // SAVE PRODUCT
  // ============================================

  saveBtn.addEventListener("click", async () => {

    if (!auth.currentUser) {

      showMessage(
        "আগে Admin Login করুন।"
      );

      return;
    }


    const name =
      document.getElementById(
        "productName"
      ).value.trim();

    const price =
      Number(
        document.getElementById(
          "productPrice"
        ).value
      );

    const stock =
      Number(
        document.getElementById(
          "productStock"
        ).value
      );

    const image =
      document.getElementById(
        "productImage"
      ).value.trim();

    const description =
      document.getElementById(
        "productDescription"
      ).value.trim();


    if (!name) {

      showMessage(
        "Product name দিন।"
      );

      return;
    }

    if (!price) {

      showMessage(
        "Product price দিন।"
      );

      return;
    }


    saveBtn.disabled = true;

    saveBtn.textContent =
      "Saving...";


    try {

      const docRef =
        await addDoc(
          collection(db, "products"),
          {

            name: name,

            price: price,

            stock: stock,

            image: image,

            description: description,

            createdAt:
              serverTimestamp(),

            createdBy:
              auth.currentUser.email

          }
        );


      console.log(
        "Product saved:",
        docRef.id
      );


      showMessage(
        "✅ Product successfully saved!"
      );


      document.getElementById(
        "productName"
      ).value = "";

      document.getElementById(
        "productPrice"
      ).value = "";

      document.getElementById(
        "productStock"
      ).value = "";

      document.getElementById(
        "productImage"
      ).value = "";

      document.getElementById(
        "productDescription"
      ).value = "";


      await loadProducts();


    } catch (error) {

      console.error(error);

      showMessage(
        "❌ Product save failed: " +
        error.code +
        " — " +
        error.message
      );

    }


    saveBtn.disabled = false;

    saveBtn.textContent =
      "Save Product";

  });


  // ============================================
  // LOAD PRODUCTS
  // ============================================

  async function loadProducts() {

    productsList.innerHTML =
      "Loading products...";


    try {

      const snapshot =
        await getDocs(
          collection(db, "products")
        );


      if (snapshot.empty) {

        productsList.innerHTML =
          "<p>No products found.</p>";

        return;
      }


      productsList.innerHTML = "";


      snapshot.forEach((productDoc) => {

        const product =
          productDoc.data();


        const div =
          document.createElement(
            "div"
          );

        div.className =
          "product";


        let imageHTML = "";

        if (product.image) {

          imageHTML = `
            <img
              src="${escapeHTML(product.image)}"
              alt="${escapeHTML(product.name || "Product")}"
              onerror="this.style.display='none'"
            >
          `;

        }


        div.innerHTML = `

          ${imageHTML}

          <h3>
            ${escapeHTML(product.name || "Unnamed Product")}
          </h3>

          <p>
            Price:
            <strong>
              ৳${Number(product.price || 0)}
            </strong>
          </p>

          <p>
            Stock:
            ${Number(product.stock || 0)}
          </p>

          <p>
            ${escapeHTML(product.description || "")}
          </p>

          ${
            auth.currentUser
              ? `
                <button
                  class="delete"
                  data-id="${productDoc.id}"
                >
                  Delete
                </button>
              `
              : ""
          }

        `;


        productsList.appendChild(div);

      });


      // DELETE BUTTONS

      document
        .querySelectorAll(".delete")
        .forEach(button => {

          button.addEventListener(
            "click",
            async () => {

              const id =
                button.dataset.id;


              if (
                !confirm(
                  "এই product delete করবেন?"
                )
              ) {

                return;

              }


              try {

                await deleteDoc(
                  doc(
                    db,
                    "products",
                    id
                  )
                );


                await loadProducts();

                alert(
                  "Product deleted."
                );


              } catch (error) {

                console.error(error);

                alert(
                  "Delete failed: " +
                  error.code +
                  " — " +
                  error.message
                );

              }

            }

          );

        });


    } catch (error) {

      console.error(error);

      productsList.innerHTML = `

        <div style="
          padding:15px;
          background:#fee2e2;
          border-radius:8px;
        ">

          <strong>
            Firestore Error
          </strong>

          <br><br>

          ${escapeHTML(error.code || "")}

          <br>

          ${escapeHTML(error.message || "")}

        </div>

      `;

    }

  }


  // ============================================
  // REFRESH
  // ============================================

  refreshBtn.addEventListener(
    "click",
    loadProducts
  );


  // ============================================
  // HTML ESCAPE
  // ============================================

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


</script>

</body>
</html>
```
