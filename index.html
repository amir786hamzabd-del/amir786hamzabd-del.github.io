<body>

    <input

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==============================
   FIREBASE CONFIG
============================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyCDCOIYo9wlK1Z-luMbL7Ckny1j10ZbDP8",

  authDomain:
  "trust-shop-bd-6047c.firebaseapp.com",

  projectId:
  "trust-shop-bd-6047c",

  storageBucket:
  "trust-shop-bd-6047c.firebasestorage.app",

  messagingSenderId:
  "312927877037",

  appId:
  "1:312927877037:web:2dbb793c9b1828ce29d324",

  measurementId:
  "G-4YPXE0RM3X"

};


/* ==============================
   INITIALIZE
============================== */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* ==============================
   VARIABLES
============================== */

let editId = null;

let productsData = [];

let cart = [];


/* ==============================
   DOM
============================== */

const productsDiv =
  document.getElementById("products");

const loadStatus =
  document.getElementById("loadStatus");

const adminPanel =
  document.getElementById("adminPanel");

const loginArea =
  document.getElementById("loginArea");

const loggedArea =
  document.getElementById("loggedArea");

const userEmail =
  document.getElementById("userEmail");

const authMessage =
  document.getElementById("authMessage");

const productMessage =
  document.getElementById("productMessage");

const saveBtn =
  document.getElementById("saveBtn");

const cancelEditBtn =
  document.getElementById("cancelEditBtn");


/* ==============================
   LOGIN
============================== */

window.login = async function(){

  const email =
    document
    .getElementById("email")
    .value.trim();

  const password =
    document
    .getElementById("password")
    .value;


  if(!email || !password){

    authMessage.innerText =
      "❌ Email এবং password দিন।";

    return;
  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    authMessage.innerText =
      "✅ Login successful.";

  }

  catch(error){

    console.error(error);

    authMessage.innerText =
      "❌ Login failed: " +
      error.message;

  }

};


/* ==============================
   LOGOUT
============================== */

window.logout = async function(){

  await signOut(auth);

};


/* ==============================
   AUTH STATE
============================== */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      loginArea.classList.add(
        "hidden"
      );

      loggedArea.classList.remove(
        "hidden"
      );

      adminPanel.classList.remove(
        "hidden"
      );

      userEmail.innerText =
        "Logged in: " + user.email;

      authMessage.innerText =
        "✅ Admin logged in.";

      renderProducts();

    }

    else{

      loginArea.classList.remove(
        "hidden"
      );

      loggedArea.classList.add(
        "hidden"
      );

      adminPanel.classList.add(
        "hidden"
      );

      userEmail.innerText = "";

      authMessage.innerText =
        "Please login as admin to manage products.";

      renderProducts();

    }

  }
);


/* ==============================
   SAVE / UPDATE PRODUCT
============================== */

window.saveProduct = async function(){

  if(!auth.currentUser){

    productMessage.innerText =
      "❌ Admin login required.";

    return;
  }


  const name =
    document
    .getElementById("productName")
    .value.trim();

  const price =
    document
    .getElementById("productPrice")
    .value.trim();

  const category =
    document
    .getElementById("productCategory")
    .value;

  const image =
    document
    .getElementById("productImage")
    .value.trim();

  const description =
    document
    .getElementById("productDescription")
    .value.trim();


  if(!name){

    productMessage.innerText =
      "❌ Product name দিন.";

    return;
  }


  if(!price){

    productMessage.innerText =
      "❌ Product price দিন.";

    return;
  }


  if(!image){

    productMessage.innerText =
      "❌ Product image URL দিন.";

    return;
  }


  try{

    const data = {

      name:name,

      price:Number(price),

      category:category,

      image:image,

      description:description,

      updatedAt:serverTimestamp(),

      updatedBy:auth.currentUser.uid

    };


    if(editId){

      await updateDoc(

        doc(
          db,
          "products",
          editId
        ),

        data

      );

      productMessage.innerText =
        "✅ Product updated successfully.";

    }

    else{

      await addDoc(

        collection(
          db,
          "products"
        ),

        {

          ...data,

          createdAt:
            serverTimestamp(),

          createdBy:
            auth.currentUser.uid

        }

      );

      productMessage.innerText =
        "✅ Product saved successfully.";

    }


    cancelEdit();

    await loadProducts();

  }

  catch(error){

    console.error(error);

    productMessage.innerText =
      "❌ Firebase error: " +
      error.message;

  }

};


/* ==============================
   LOAD PRODUCTS
============================== */

async function loadProducts(){

  loadStatus.innerText =
    "⏳ Loading products...";

  productsDiv.innerHTML = "";


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "products"
        )
      );


    productsData = [];


    snapshot.forEach(
      item => {

        productsData.push({

          id:item.id,

          ...item.data()

        });

      }
    );


    renderProducts();


    loadStatus.innerText =
      "✅ Products loaded: " +
      productsData.length;

  }

  catch(error){

    console.error(error);

    loadStatus.innerText =
      "❌ Products load failed: " +
      error.message;

    productsDiv.innerHTML = `

      <div class="box">

        <h3>Firebase Error</h3>

        <p style="margin-top:10px">
        ${escapeHtml(error.message)}
        </p>

      </div>

    `;

  }

}


/* ==============================
   RENDER PRODUCTS
============================== */

function renderProducts(){

  productsDiv.innerHTML = "";


  if(productsData.length === 0){

    productsDiv.innerHTML = `

      <div class="box">

        <h3>No products found.</h3>

        <p style="margin-top:8px">
        Admin login করে প্রথম product add করুন.
        </p>

      </div>

    `;

    return;
  }


  productsData.forEach(
    product => {

      const div =
        document.createElement("div");

      div.className =
        "product";


      div.innerHTML = `

        <img
          src="${escapeAttr(product.image || '')}"
          onerror="this.src='https://placehold.co/600x600?text=No+Image'"
        >

        <div class="product-body">

          <div class="product-name">
            ${escapeHtml(
              product.name || "Product"
            )}
          </div>

          <div class="price">
            ৳${Number(
              product.price || 0
            )}
          </div>

          <div class="category">
            ${escapeHtml(
              product.category || ""
            )}
          </div>

          <div class="description">
            ${escapeHtml(
              product.description || ""
            )}
          </div>

          <div class="product-actions">

            <button
              class="green"
              onclick="addToCart('${product.id}')"
            >
              🛒 Add
            </button>

            ${
              auth.currentUser
              ?
              `
              <button
                class="blue"
                onclick="editProduct('${product.id}')"
              >
                Edit
              </button>

              <button
                class="red"
                onclick="deleteProduct('${product.id}')"
              >
                Delete
              </button>
              `
              :
              ""
            }

          </div>

        </div>

      `;


      productsDiv.appendChild(div);

    }
  );

}


/* ==============================
   EDIT
============================== */

window.editProduct =
function(id){

  const product =
    productsData.find(
      p => p.id === id
    );


  if(!product) return;


  editId = id;


  document
    .getElementById("productName")
    .value =
      product.name || "";


  document
    .getElementById("productPrice")
    .value =
      product.price || "";


  document
    .getElementById("productCategory")
    .value =
      product.category || "Men";


  document
    .getElementById("productImage")
    .value =
      product.image || "";


  document
    .getElementById("productDescription")
    .value =
      product.description || "";


  saveBtn.innerText =
    "💾 Update Product";

  cancelEditBtn.classList.remove(
    "hidden"
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* ==============================
   CANCEL EDIT
============================== */

window.cancelEdit =
function(){

  editId = null;

  document
    .getElementById("productName")
    .value = "";

  document
    .getElementById("productPrice")
    .value = "";

  document
    .getElementById("productImage")
    .value = "";

  document
    .getElementById("productDescription")
    .value = "";

  saveBtn.innerText =
    "➕ Save Product";

  cancelEditBtn.classList.add(
    "hidden"
  );

};


/* ==============================
   DELETE
============================== */

window.deleteProduct =
async function(id){

  if(!auth.currentUser){

    alert(
      "Admin login required."
    );

    return;
  }


  if(!confirm(
    "এই product delete করবেন?"
  )) return;


  try{

    await deleteDoc(
      doc(
        db,
        "products",
        id
      )
    );


    alert(
      "✅ Product deleted."
    );


    await loadProducts();

  }

  catch(error){

    console.error(error);

    alert(
      "❌ Delete failed: " +
      error.message
    );

  }

};


/* ==============================
   CART
============================== */

window.addToCart =
function(id){

  const product =
    productsData.find(
      p => p.id === id
    );


  if(!product) return;


  cart.push(product);

  updateCart();

  alert(
    product.name +
    " added to cart."
  );

};


function updateCart(){

  document
    .getElementById("cartCount")
    .innerText =
      cart.length;


  const items =
    document.getElementById(
      "cartItems"
    );


  items.innerHTML = "";


  let total = 0;


  cart.forEach(
    (product,index) => {

      total +=
        Number(product.price || 0);


      const div =
        document.createElement("div");

      div.className =
        "cart-item";


      div.innerHTML = `

        <div>

          <strong>
            ${escapeHtml(
              product.name
            )}
          </strong>

          <br>

          ৳${Number(
            product.price || 0
          )}

        </div>

        <button
          class="red"
          onclick="removeCart(${index})"
        >
          Remove
        </button>

      `;


      items.appendChild(div);

    }
  );


  document
    .getElementById("cartTotal")
    .innerText =
      "Total: ৳" + total;

}


window.removeCart =
function(index){

  cart.splice(index,1);

  updateCart();

};


window.openCart =
function(){

  updateCart();

  document
    .getElementById("cartModal")
    .classList.add("show");

};


window.closeCart =
function(){

  document
    .getElementById("cartModal")
    .classList.remove("show");

};


/* ==============================
   WHATSAPP ORDER
============================== */

window.orderWhatsApp =
function(){

  if(cart.length === 0){

    alert(
      "Cart is empty."
    );

    return;
  }


  const name =
    document
    .getElementById("customerName")
    .value.trim();

  const phone =
    document
    .getElementById("customerPhone")
    .value.trim();

  const address =
    document
    .getElementById("customerAddress")
    .value.trim();


  if(!name || !phone || !address){

    alert(
      "Name, mobile number এবং address দিন."
    );

    return;
  }


  let message =
    "🛍️ Trust Shop BD Order%0A%0A";


  message +=
    "Name: " +
    encodeURIComponent(name) +
    "%0A";

  message +=
    "Phone: " +
    encodeURIComponent(phone) +
    "%0A";

  message +=
    "Address: " +
    encodeURIComponent(address) +
    "%0A%0A";


  message +=
    "Products:%0A";


  let total = 0;


  cart.forEach(
    (product,index) => {

      total +=
        Number(product.price || 0);

      message +=
        encodeURIComponent(
          (index+1) +
          ". " +
          product.name +
          " - ৳" +
          product.price
        ) +
        "%0A";

    }
  );


  message +=
    "%0ATotal: ৳" +
    total;


  /*
    Trust Shop BD WhatsApp
    Number: 01580950532
  */

  const whatsappNumber =
    "8801580950532";


  const url =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    message;


  window.open(
    url,
    "_blank"
  );

};


/* ==============================
   SECURITY HELPERS
============================== */

function escapeHtml(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttr(value){

  return String(value)
    .replaceAll(
      '"',
      "&quot;"
    );

}


/* ==============================
   START
============================== */

loadProducts();

</script>

</body>
</html>
